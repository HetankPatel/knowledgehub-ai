<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KnowledgeHub AI</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <main class="container">

        <h1>KnowledgeHub AI</h1>

        <p class="subtitle">
            Upload documents and ask questions about their content.
        </p>


        <section class="card">

            <h2>Upload a Document</h2>

            <p>
                Supported files: TXT, Markdown, and PDF
            </p>

            <input
                type="file"
                id="document-file"
                accept=".txt,.md,.pdf"
            >

            <button id="upload-button">
                Upload
            </button>

            <p id="upload-message"></p>

        </section>


        <section class="card">

            <h2>Your Documents</h2>

            <div id="document-list">
                No documents uploaded yet.
            </div>

        </section>


        <section class="card">

            <h2>Ask a Question</h2>

            <input
                type="text"
                id="question"
                placeholder="Ask something about your documents..."
            >

            <button id="ask-button">
                Ask
            </button>

            <div id="answer">
                AI question answering will be added next.
            </div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
